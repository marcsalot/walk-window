<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walk Window</title>
<meta name="description" content="Safe to walk the dog? Pavement heat, air quality, rain, and the best hours for your location.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<meta name="theme-color" content="#0A0C10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── THEMES ───────────────────────────────────────────── */
:root,[data-theme="dark"]{
  --bg:#0A0C10;--s1:#0F1319;--s2:#161B24;--border:#232B3A;
  --text:#E2E8F4;--muted:#7A8599;--dim:#3D4A60;
  --safe:#34D399;--safe-dim:rgba(52,211,153,.12);--safe-b:rgba(52,211,153,.3);
  --caution:#FBBF24;--caution-dim:rgba(251,191,36,.12);--caution-b:rgba(251,191,36,.3);
  --danger:#F87171;--danger-dim:rgba(248,113,113,.12);--danger-b:rgba(248,113,113,.3);
  --blue:#4F8EF7;--input-bg:#0F1319;--nav-bg:rgba(10,12,16,.92);--now-bg:rgba(79,142,247,.07);
}
[data-theme="midnight"]{
  --bg:#07090D;--s1:#0F1520;--s2:#172030;--border:#1E2D42;
  --text:#F0F4FF;--muted:#8295B5;--dim:#2D405A;
  --blue:#5B9BFF;--input-bg:#0F1520;--nav-bg:rgba(7,9,13,.93);--now-bg:rgba(91,155,255,.07);
}
[data-theme="dusk"]{
  --bg:#14101E;--s1:#1C1428;--s2:#241A34;--border:#3A2555;
  --text:#EDE6FF;--muted:#9B7DC8;--dim:#5A3D88;
  --blue:#A78BFA;--input-bg:#1C1428;--nav-bg:rgba(20,16,30,.93);--now-bg:rgba(167,139,250,.07);
}
[data-theme="ocean"]{
  --bg:#06111F;--s1:#091828;--s2:#0D2035;--border:#152D47;
  --text:#E0F0FF;--muted:#6BA8D4;--dim:#1E3D5A;
  --blue:#38BDF8;--input-bg:#091828;--nav-bg:rgba(6,17,31,.93);--now-bg:rgba(56,189,248,.07);
}
[data-theme="forest"]{
  --bg:#0B1810;--s1:#0F2015;--s2:#14281A;--border:#1E3824;
  --text:#E8F5EC;--muted:#6B9A78;--dim:#2E5038;
  --blue:#4ADE80;--input-bg:#0F2015;--nav-bg:rgba(11,26,16,.93);--now-bg:rgba(74,222,128,.07);
}
[data-theme="light"]{
  --bg:#F0F4F8;--s1:#FFFFFF;--s2:#E8EDF3;--border:#C9D3DF;
  --text:#0D1829;--muted:#4A5568;--dim:#94A3B8;
  --blue:#2563EB;--input-bg:#FFFFFF;--nav-bg:rgba(240,244,248,.94);--now-bg:rgba(37,99,235,.06);
}
/* safe/caution/danger are consistent across all themes */
[data-theme="midnight"],[data-theme="dusk"],[data-theme="ocean"],[data-theme="forest"]{
  --safe:#34D399;--safe-dim:rgba(52,211,153,.12);--safe-b:rgba(52,211,153,.3);
  --caution:#FBBF24;--caution-dim:rgba(251,191,36,.12);--caution-b:rgba(251,191,36,.3);
  --danger:#F87171;--danger-dim:rgba(248,113,113,.12);--danger-b:rgba(248,113,113,.3);
}
[data-theme="light"]{
  --safe:#059669;--safe-dim:rgba(5,150,105,.08);--safe-b:rgba(5,150,105,.25);
  --caution:#D97706;--caution-dim:rgba(217,119,6,.08);--caution-b:rgba(217,119,6,.25);
  --danger:#DC2626;--danger-dim:rgba(220,38,38,.08);--danger-b:rgba(220,38,38,.25);
}

/* ── RESET ────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;min-height:100%;transition:background .25s,color .25s}

/* ── NAV ──────────────────────────────────────────────── */
nav{position:sticky;top:0;z-index:300;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:960px;margin:0 auto;padding:0 14px;height:52px;display:flex;align-items:center;gap:8px}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:15px;white-space:nowrap;flex-shrink:0;cursor:default;letter-spacing:-.01em}
.search-wrap{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.si{position:absolute;left:9px;color:var(--dim);pointer-events:none}
.search-input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px 6px 30px;color:var(--text);font:13px 'Inter';outline:none;transition:border-color .15s;min-width:0}
.search-input:focus{border-color:var(--blue)}
.search-input::placeholder{color:var(--dim)}
.nb{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 11px;color:var(--muted);font:600 12px 'Inter';cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;line-height:1.4}
.nb:hover{border-color:var(--blue);color:var(--blue)}
#rbtn:disabled{opacity:.3;pointer-events:none}

/* ── MAIN ─────────────────────────────────────────────── */
.main{max-width:960px;margin:0 auto;padding:18px 14px 100px}

/* ── LOC ROW ──────────────────────────────────────────── */
.loc-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;min-height:20px;gap:8px}
.loc-name{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
.upd-time{font-size:12px;color:var(--dim);white-space:nowrap}

/* ── SCREENS ──────────────────────────────────────────── */
.cscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62vh;text-align:center;gap:12px;padding:0 24px}
.big-icon{font-size:56px;line-height:1}
.c-title{font-family:'Archivo',sans-serif;font-size:28px;font-weight:900;letter-spacing:-.03em}
.c-sub{font-size:14px;color:var(--muted);max-width:360px;line-height:1.75}
.btn-go{display:inline-flex;align-items:center;gap:7px;padding:12px 26px;background:var(--safe);color:#0A0C10;border:none;border-radius:999px;font:700 14px 'Archivo',sans-serif;cursor:pointer;transition:filter .15s;margin-top:6px;letter-spacing:.01em}
.btn-go:hover{filter:brightness(1.08)}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--safe);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── HERO ─────────────────────────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:28px 24px 24px;margin-bottom:14px;border:1px solid;transition:all .3s}
.hero::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;transition:opacity .3s}
.hero.safe{background:var(--s1);border-color:var(--safe-b)}
.hero.safe::before{background:radial-gradient(ellipse 55% 80% at 10% 50%,color-mix(in srgb,var(--safe) 22%,transparent),transparent 65%)}
.hero.caution{background:var(--s1);border-color:var(--caution-b)}
.hero.caution::before{background:radial-gradient(ellipse 55% 80% at 10% 50%,color-mix(in srgb,var(--caution) 22%,transparent),transparent 65%)}
.hero.danger{background:var(--s1);border-color:var(--danger-b)}
.hero.danger::before{background:radial-gradient(ellipse 55% 80% at 10% 50%,color-mix(in srgb,var(--danger) 22%,transparent),transparent 65%)}
.badge-pill{display:inline-flex;align-items:center;gap:9px;padding:9px 20px;border-radius:999px;font-family:'Archivo',sans-serif;font-weight:900;font-size:19px;letter-spacing:-.02em;margin-bottom:12px;position:relative}
.badge-icon{font-size:16px;display:flex;align-items:center}
.hero.safe .badge-pill{background:var(--safe);color:#0D1829}
.hero.caution .badge-pill{background:var(--caution);color:#0D1829}
.hero.danger .badge-pill{background:var(--danger);color:#fff}
/* danger text stays white on red across all themes */
.h-conditions{font-size:13px;color:var(--muted);margin-bottom:5px;position:relative}
.h-reason{font-size:13px;font-weight:600;position:relative}
.hero.safe .h-reason{color:var(--safe)}
.hero.caution .h-reason{color:var(--caution)}
.hero.danger .h-reason{color:var(--danger)}

/* ── CONDITION CARDS ──────────────────────────────────── */
.conds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
@media(max-width:620px){.conds{grid-template-columns:repeat(3,1fr)}}
@media(max-width:380px){.conds{grid-template-columns:repeat(2,1fr)}}
.cc{background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:12px 12px 10px}
.cc-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin-bottom:5px}
.cc-val{font-family:'Archivo',sans-serif;font-size:18px;font-weight:800;line-height:1;letter-spacing:-.02em}
.cc-sub{font-size:11px;margin-top:3px}
.lv-safe .cc-val,.lv-safe .cc-sub{color:var(--safe)}
.lv-caution .cc-val,.lv-caution .cc-sub{color:var(--caution)}
.lv-danger .cc-val,.lv-danger .cc-sub{color:var(--danger)}
.lv-neutral .cc-val{color:var(--text)}.lv-neutral .cc-sub{color:var(--muted)}

/* ── DAY PICKER ───────────────────────────────────────── */
.section-hd{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:10px}
.day-picker{display:flex;gap:5px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.day-picker::-webkit-scrollbar{display:none}
.dpill{flex-shrink:0;padding:5px 14px;border:1px solid var(--border);border-radius:999px;font:700 12px 'Archivo',sans-serif;color:var(--muted);background:none;cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.01em}
.dpill:hover{border-color:var(--blue);color:var(--blue)}
.dpill.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* ── WALK WINDOWS ─────────────────────────────────────── */
.windows-box{background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:14px 18px;margin-bottom:14px}
.win-row{display:flex;align-items:flex-start;gap:10px;padding:5px 0}
.win-row+.win-row{border-top:1px solid var(--border)}
.win-day-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);min-width:66px;padding-top:3px;flex-shrink:0}
.w-pills{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.wpill{padding:4px 12px;border-radius:999px;font:700 12px 'Archivo',sans-serif;letter-spacing:.01em;background:var(--safe-dim);color:var(--safe);border:1px solid var(--safe-b)}
.wpill.allday{background:var(--safe);color:#0A0C10;border-color:var(--safe)}
[data-theme="light"] .wpill.allday{color:#0D1829}
.wpill.none{background:var(--danger-dim);color:var(--danger);border-color:var(--danger-b)}

/* ── BAR CHART ────────────────────────────────────────── */
.chart-box{background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-bottom:14px}
.chart-tabs{display:flex;gap:5px;margin-bottom:12px}
.ctab{padding:4px 13px;border:1px solid var(--border);border-radius:999px;font:700 11px 'Archivo',sans-serif;color:var(--muted);background:none;cursor:pointer;transition:all .15s;letter-spacing:.02em}
.ctab:hover{border-color:var(--blue);color:var(--blue)}
.ctab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.chart-y-label{font-size:11px;color:var(--dim);margin-bottom:7px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.chart-area{height:120px;display:flex;align-items:flex-end;gap:3px}
.chart-bar-col{flex:1;display:flex;align-items:flex-end}
.cbar{width:100%;border-radius:3px 3px 0 0;min-height:2px;position:relative;cursor:default;transition:opacity .1s}
.cbar:hover{opacity:.75}
.cbar-tip{display:none;position:absolute;bottom:calc(100%+5px);left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:11px;white-space:nowrap;color:var(--text);z-index:20;pointer-events:none;font-weight:600}
.cbar:hover .cbar-tip{display:block}
.chart-labels{display:flex;gap:3px;margin-top:5px}
.clabel{flex:1;text-align:center;font-size:9px;color:var(--dim);font-weight:700;overflow:hidden;white-space:nowrap;letter-spacing:.03em}
.slider-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--blue);cursor:pointer;height:4px}
.rl{font-size:11px;color:var(--muted);white-space:nowrap;min-width:72px;text-align:right;font-weight:600}

/* ── HOURLY TABLE ─────────────────────────────────────── */
.hourly-wrap{background:var(--s1);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:14px}
.htable{width:100%;border-collapse:collapse}
.htable thead th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);background:var(--s2);border-bottom:1px solid var(--border)}
.htable tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
.htable tbody tr:last-child{border-bottom:none}
.htable tbody tr.now-row{background:var(--now-bg)}
.htable tbody tr:hover{background:var(--s2)}
.htable td{padding:7px 10px;font-size:13px;vertical-align:middle}
.td-time-cell{color:var(--muted);font-weight:700;font-size:12px;white-space:nowrap;letter-spacing:.01em;line-height:1.2}
.td-why{font-size:11px;font-weight:500;margin-top:3px;line-height:1.3;opacity:.85}
.safe-why{color:var(--safe)}.caution-why{color:var(--caution)}.danger-why{color:var(--danger)}
.now-tag{background:var(--blue);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle;font-weight:700}
.td-dot{width:24px;text-align:center}
.dsm{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.d-safe{background:var(--safe)}.d-caution{background:var(--caution)}.d-danger{background:var(--danger)}
.safe-t{color:var(--safe);font-weight:700}
.caution-t{color:var(--caution);font-weight:700}
.danger-t{color:var(--danger);font-weight:700}
.neutral-t{color:var(--text)}
.td-rain{min-width:80px}
.rbar-wrap{display:flex;align-items:center;gap:5px}
.rbar-bg{flex:1;height:4px;background:var(--s2);border-radius:2px;overflow:hidden;min-width:34px}
.rbar-fg{height:100%;background:var(--blue);border-radius:2px}
.rpct{font-size:11px;color:var(--muted);min-width:30px;text-align:right;font-weight:600}
.td-wx{font-size:15px;text-align:center}
.hide-sm{display:table-cell}
@media(max-width:500px){.hide-sm{display:none}}

/* ── LEGEND ───────────────────────────────────────────── */
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:4px 0 8px}
.leg-i{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.leg-dot{width:8px;height:8px;border-radius:50%}
.leg-note{margin-left:auto;font-size:11px;color:var(--dim)}
@media(max-width:460px){.leg-note{display:none}}
</style>
</head>
<body>

<nav>
<div class="nav-inner">
  <span class="logo">🐾 Walk Window</span>
  <div class="search-wrap">
    <svg class="si" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="search-input" id="search" type="text" placeholder="ZIP or city…"
      onkeydown="if(event.key==='Enter')doSearch()" autocomplete="off" inputmode="search">
  </div>
  <button class="nb" onclick="startApp()" title="Use my location">📍</button>
  <button class="nb" id="tbtn" onclick="cycleTheme()" title="Change theme">🌙</button>
  <button class="nb" id="rbtn" onclick="doRefresh()" disabled title="Refresh">↻</button>
</div>
</nav>

<div class="main">
  <div class="loc-row">
    <div class="loc-name" id="loc-name"></div>
    <div class="upd-time" id="upd-time"></div>
  </div>
  <div id="body">
    <div class="cscreen">
      <div class="spinner"></div>
      <div style="color:var(--muted);font-size:14px;margin-top:8px">Getting your location…</div>
    </div>
  </div>
</div>

<script>
const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast';
const AQ_URL      = 'https://air-quality-api.open-meteo.com/v1/air-quality';
const GEO_REV     = 'https://nominatim.openstreetmap.org/reverse';
const GEO_SEARCH  = 'https://geocoding-api.open-meteo.com/v1/search';

const THEMES     = ['dark','midnight','dusk','ocean','forest','light'];
const THEME_ICON = {dark:'🌙',midnight:'⭐',dusk:'🌅',ocean:'🌊',forest:'🌲',light:'☀️'};

let S = {
  lat:null, lon:null, city:'', wx:null, aq:null, fetched:null,
  theme: localStorage.getItem('ww-theme') || 'dark',
  day: 0, chartMode: 'rain', sliderStart: 0
};
applyTheme(S.theme);

// ── Location & Search ────────────────────────────────────────

let _geoTimer = null;

function startApp() {
  if (!navigator.geolocation) { showErr('Geolocation not supported.'); return; }
  spin('Getting your location…');
  clearTimeout(_geoTimer);
  // Fallback: browsers on file:// or with silent blocks never fire the callback
  _geoTimer = setTimeout(() => showErr(
    'GPS is not responding. This is normal on local file:// URLs.'
  ), 7000);
  navigator.geolocation.getCurrentPosition(onPos, onGeoErr, { timeout: 10000, maximumAge: 60000 });
}

function onGeoErr(e) {
  clearTimeout(_geoTimer);
  const m = {1:'Location access was denied.',2:'Cannot determine location.',3:'Location request timed out.'};
  showErr(m[e.code] || 'Could not get location.');
}

async function onPos(pos) {
  clearTimeout(_geoTimer);
  S.lat = pos.coords.latitude; S.lon = pos.coords.longitude; S.day = 0;
  S.fetched = new Date(); spin('Fetching weather…');
  try {
    const [city, wx, aq] = await Promise.all([revGeocode(), fetchWx(), fetchAQ()]);
    S.city = city; S.wx = wx; S.aq = aq;
    // Cache so next visit skips the GPS prompt
    localStorage.setItem('ww-lat', S.lat);
    localStorage.setItem('ww-lon', S.lon);
    localStorage.setItem('ww-city', S.city);
    S.sliderStart = Math.max(0, new Date().getHours() - 1);
    render();
    document.getElementById('rbtn').disabled = false;
  } catch(e) { showErr('Could not load weather. ' + (e.message || '')); }
}

async function doSearch() {
  const q = document.getElementById('search').value.trim();
  if (!q) return;
  spin('Finding ' + q + '…');
  try {
    const r = await fetch(`${GEO_SEARCH}?name=${encodeURIComponent(q)}&count=1&format=json&language=en`);
    const d = await r.json();
    if (!d.results?.length) { showErr(`No results for "${q}".`); return; }
    const loc = d.results[0];
    S.lat = loc.latitude; S.lon = loc.longitude; S.day = 0;
    S.city = [loc.name, loc.admin1_code || loc.country_code].filter(Boolean).join(', ');
    S.fetched = new Date(); spin('Fetching weather…');
    const [wx, aq] = await Promise.all([fetchWx(), fetchAQ()]);
    S.wx = wx; S.aq = aq;
    // Cache searched location so it loads next time
    localStorage.setItem('ww-lat', S.lat);
    localStorage.setItem('ww-lon', S.lon);
    localStorage.setItem('ww-city', S.city);
    S.sliderStart = Math.max(0, new Date().getHours() - 1);
    document.getElementById('search').value = '';
    render();
    document.getElementById('rbtn').disabled = false;
  } catch(e) { showErr('Search failed. ' + (e.message || '')); }
}

async function doRefresh() {
  document.getElementById('rbtn').disabled = true;
  spin('Refreshing…');
  try {
    const [wx, aq] = await Promise.all([fetchWx(), fetchAQ()]);
    S.wx = wx; S.aq = aq; S.fetched = new Date(); render();
  } catch(e) { showErr('Refresh failed.'); }
  finally { document.getElementById('rbtn').disabled = false; }
}

// ── API ──────────────────────────────────────────────────────

async function revGeocode() {
  try {
    const r = await fetch(
      `${GEO_REV}?format=json&lat=${S.lat}&lon=${S.lon}&accept-language=en`,
      { headers: { 'User-Agent': 'WalkWindow/3.0 (themarc.net)' } }
    );
    const d = await r.json(); const a = d.address || {};
    const city = a.city || a.town || a.village || a.county || '';
    const st   = a.state_code || '';
    return city ? (st ? `${city}, ${st}` : city) : 'Your location';
  } catch { return 'Your location'; }
}

async function fetchWx() {
  const p = new URLSearchParams({
    latitude: S.lat, longitude: S.lon,
    hourly: 'temperature_2m,apparent_temperature,precipitation_probability,precipitation,weathercode,windspeed_10m,direct_radiation,cloudcover,relativehumidity_2m',
    current_weather: 'true',
    temperature_unit: 'fahrenheit', windspeed_unit: 'mph', precipitation_unit: 'inch',
    timezone: 'auto', forecast_days: '7'
  });
  const r = await fetch(`${WEATHER_URL}?${p}`);
  if (!r.ok) throw new Error(`Weather API ${r.status}`);
  return r.json();
}

async function fetchAQ() {
  try {
    const p = new URLSearchParams({ latitude: S.lat, longitude: S.lon, hourly: 'us_aqi', timezone: 'auto', forecast_days: '7' });
    const r = await fetch(`${AQ_URL}?${p}`);
    if (!r.ok) return null; return r.json();
  } catch { return null; }
}

// ── Calculations ─────────────────────────────────────────────

function pavTemp(airF, radWm2, cloud) {
  if (!radWm2 || radWm2 <= 0) return Math.round(airF);
  return Math.round(airF + (radWm2 / 1000) * 52 * Math.max(0, 1 - cloud / 110));
}

function worst(a, b) {
  return ['safe','caution','danger'].indexOf(a) >= ['safe','caution','danger'].indexOf(b) ? a : b;
}

const WD = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Icy fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Ice pellets',80:'Rain showers',81:'Rain showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Hail',99:'Severe hail'};
const WI = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',77:'🌨️',80:'🌧️',81:'🌧️',82:'⛈️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
function wxd(c){return WD[c] || 'Mixed'} function wxi(c){return WI[c] || '🌡️'}

function assess(wx, aqArr, i) {
  const airT   = wx.hourly.temperature_2m[i] ?? 0;
  const feelsL = wx.hourly.apparent_temperature[i] ?? airT;
  const wcode  = wx.hourly.weathercode[i] ?? 0;
  const rad    = wx.hourly.direct_radiation[i] ?? 0;
  const cloud  = wx.hourly.cloudcover[i] ?? 0;
  const hum    = wx.hourly.relativehumidity_2m[i] ?? 0;
  const rain   = wx.hourly.precipitation_probability[i] ?? 0;
  const pav    = pavTemp(airT, rad, cloud);
  const aqi    = (aqArr && aqArr[i] != null) ? aqArr[i] : null;
  let lvl = 'safe'; const warns = [];

  if (pav >= 130)      { lvl = worst(lvl,'danger');  warns.push(`Pavement ${pav}°F — burns in seconds`); }
  else if (pav >= 110) { lvl = worst(lvl,'caution'); warns.push(`Pavement ${pav}°F — burns possible`); }
  else if (pav >= 92)  { lvl = worst(lvl,'caution'); warns.push(`Pavement ${pav}°F — warm`); }

  if      (feelsL >= 103) { lvl = worst(lvl,'danger');  warns.push(`Feels like ${Math.round(feelsL)}°F — extreme heat`); }
  else if (feelsL >= 90)  { lvl = worst(lvl,'caution'); warns.push(`Feels like ${Math.round(feelsL)}°F — hot`); }
  else if (feelsL <= 10)  { lvl = worst(lvl,'danger');  warns.push(`Feels like ${Math.round(feelsL)}°F — dangerous cold`); }
  else if (feelsL <= 28)  { lvl = worst(lvl,'caution'); warns.push(`Feels like ${Math.round(feelsL)}°F — very cold`); }

  if      (wcode >= 95) { lvl = worst(lvl,'danger');  warns.push('Thunderstorm'); }
  else if (wcode >= 51) { lvl = worst(lvl,'caution'); warns.push(wxd(wcode)); }

  if (aqi != null) {
    if      (aqi > 150) { lvl = worst(lvl,'danger');  warns.push(`AQI ${aqi} — unhealthy`); }
    else if (aqi > 100) { lvl = worst(lvl,'caution'); warns.push(`AQI ${aqi} — sensitive`); }
    else if (aqi > 50)  { lvl = worst(lvl,'caution'); warns.push(`AQI ${aqi} — moderate`); }
  }

  return { lvl, warns, pav, feelsL: Math.round(feelsL), hum, rain, aqi, wcode, airT };
}

// ── BUG FIX: use LOCAL date string, not UTC ─────────────────
function localDateStr(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dy = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dy}`;
}

function getDayStart(offset) {
  const ds = localDateStr(offset);
  const idx = S.wx.hourly.time.findIndex(t => t.startsWith(ds));
  return idx >= 0 ? idx : offset * 24;
}

function fmtH(ts) {
  if (!ts) return '';
  const h = parseInt(ts.split('T')[1]);
  if (h === 0) return '12a'; if (h < 12) return `${h}a`; if (h === 12) return '12p'; return `${h-12}p`;
}

function fmtDay(offset, short = false) {
  if (offset === 0) return 'Today';
  if (offset === 1) return short ? 'Tmrw' : 'Tomorrow';
  const d = new Date(); d.setDate(d.getDate() + offset);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
}

function fmtTime(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

function tempColor(f) {
  if (f < 32) return '#93C5FD';
  if (f < 50) return '#67E8F9';
  if (f < 65) return '#34D399';
  if (f < 80) return '#FBBF24';
  if (f < 90) return '#F97316';
  return '#F87171';
}

function getWins(dayA) {
  const wins = []; let ws = -1;
  dayA.forEach((a, i) => {
    if (a.lvl === 'safe' && ws === -1) ws = i;
    else if (a.lvl !== 'safe' && ws !== -1) { wins.push([ws, i - 1]); ws = -1; }
  });
  if (ws !== -1) wins.push([ws, dayA.length - 1]);
  return wins;
}

function renderWinPills(wins, dayTimes) {
  if (!wins.length) return `<span class="wpill none">No good windows</span>`;
  const totalSafe = wins.reduce((acc, [s, e]) => acc + (e - s + 1), 0);
  if (totalSafe >= 22) return `<span class="wpill allday">All day</span>`;
  return wins.map(([s, e]) => {
    const lbl = s === e ? fmtH(dayTimes[s]) : `${fmtH(dayTimes[s])} – ${fmtH(dayTimes[e])}`;
    return `<span class="wpill">${lbl}</span>`;
  }).join('');
}

function hourWhy(a) {
  if (a.lvl === 'safe') {
    const parts = [`Pavement ${a.pav}° · feels ${a.feelsL}°`];
    if (a.rain >= 20) parts.push(`${a.rain}% rain`);
    return parts.join(' · ');
  }
  return a.warns[0] ? a.warns[0].replace(/°F/g, '°') : '';
}

function flClass(f) { return f >= 103 || f <= 10 ? 'danger-t' : f >= 90 || f <= 28 ? 'caution-t' : 'neutral-t'; }
function pavClass(p) { return p >= 110 ? 'danger-t' : p >= 92 ? 'caution-t' : 'safe-t'; }

// ── Main Render ──────────────────────────────────────────────

function render() {
  const wx = S.wx;
  const aqArr = S.aq?.hourly?.us_aqi || null;
  const totalH = wx.hourly.time.length;
  const si = getDayStart(S.day);
  const dayTimes = wx.hourly.time.slice(si, si + 24);
  const dayA = dayTimes.map((_, i) => assess(wx, aqArr, si + i));
  const isToday = S.day === 0;
  const nowH = isToday ? new Date().getHours() : 0;
  const curI = Math.min(nowH, dayA.length - 1);
  const cur  = dayA[curI] || dayA[0];
  const cw   = wx.current_weather;

  // Location bar
  document.getElementById('loc-name').innerHTML =
    `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>${S.city || 'Your location'}`;
  document.getElementById('upd-time').textContent = 'Updated ' + fmtTime(S.fetched);

  // Hero (today only)
  const BADGE = { safe: ['✓', 'Right now'], caution: ['⚠', 'Use caution'], danger: ['✕', 'Not right now'] };
  const [bIcon, bText] = BADGE[cur.lvl];
  const reason = cur.warns.length ? cur.warns[0] : 'All conditions clear';
  const heroHtml = isToday ? `<div class="hero ${cur.lvl}">
    <div class="badge-pill">
      <span class="badge-icon">${bIcon}</span>${bText}
    </div>
    <div class="h-conditions">${Math.round(cw.temperature)}°F · ${wxi(cw.weathercode)} ${wxd(cw.weathercode)} · ${Math.round(cw.windspeed)} mph</div>
    <div class="h-reason">${reason}</div>
  </div>` : '';

  // Condition cards (today only)
  const aqiNow  = aqArr ? (aqArr[si + curI] ?? null) : null;
  const aqiLvl  = aqiNow == null ? 'neutral' : aqiNow > 150 ? 'danger' : aqiNow > 50 ? 'caution' : 'safe';
  const aqiDisp = aqiNow == null ? '—' : `${aqiNow}`;
  const aqiSub  = aqiNow == null ? 'No data' : aqiNow > 150 ? 'Unhealthy' : aqiNow > 100 ? 'Sensitive' : aqiNow > 50 ? 'Moderate' : 'Good';
  const pavLvl  = cur.pav >= 110 ? 'danger' : cur.pav >= 92 ? 'caution' : 'safe';
  const flLvl   = cur.feelsL >= 103 || cur.feelsL <= 10 ? 'danger' : cur.feelsL >= 90 || cur.feelsL <= 28 ? 'caution' : 'safe';
  const flSub   = cur.feelsL >= 103 ? 'Extreme heat' : cur.feelsL >= 90 ? 'Hot' : cur.feelsL <= 10 ? 'Danger cold' : cur.feelsL <= 28 ? 'Very cold' : 'Comfortable';
  const wxLvl   = cur.wcode >= 95 ? 'danger' : cur.wcode >= 51 ? 'caution' : 'safe';
  const humSub  = cur.hum > 80 ? 'Very humid' : cur.hum > 60 ? 'Humid' : cur.hum > 40 ? 'Comfortable' : 'Dry';
  const cardsHtml = isToday ? `<div class="conds">
    <div class="cc lv-${pavLvl}"><div class="cc-lbl">Pavement</div><div class="cc-val">${cur.pav}°F</div><div class="cc-sub">${cur.pav >= 110 ? 'Burns possible' : cur.pav >= 92 ? 'Warm' : 'Safe'}</div></div>
    <div class="cc lv-${flLvl}"><div class="cc-lbl">Feels like</div><div class="cc-val">${cur.feelsL}°F</div><div class="cc-sub">${flSub}</div></div>
    <div class="cc lv-neutral"><div class="cc-lbl">Humidity</div><div class="cc-val">${cur.hum}%</div><div class="cc-sub">${humSub}</div></div>
    <div class="cc lv-${aqiLvl}"><div class="cc-lbl">Air quality</div><div class="cc-val">${aqiDisp}</div><div class="cc-sub">${aqiSub}</div></div>
    <div class="cc lv-${wxLvl}"><div class="cc-lbl">Weather</div><div class="cc-val" style="font-size:21px">${wxi(cur.wcode)}</div><div class="cc-sub">${wxd(cur.wcode)}</div></div>
  </div>` : '';

  // Day picker
  const numDays = Math.min(7, Math.floor(totalH / 24));
  const dpHtml = `<div class="day-picker">${Array.from({ length: numDays }, (_, i) =>
    `<button class="dpill${i === S.day ? ' active' : ''}" onclick="selectDay(${i})">${fmtDay(i, false)}</button>`
  ).join('')}</div>`;

  // Walk windows — always show today + tomorrow side by side
  let winsHtml;
  if (!isToday) {
    // On a future day, just show that day
    const wins = getWins(dayA);
    winsHtml = `<div class="win-row">
      <div class="win-day-label">${fmtDay(S.day, true)}</div>
      <div class="w-pills">${renderWinPills(wins, dayTimes)}</div>
    </div>`;
  } else {
    // Today: show today + tomorrow
    const todayWins = getWins(dayA);
    const tmrwSi = getDayStart(1);
    const tmrwTimes = wx.hourly.time.slice(tmrwSi, tmrwSi + 24);
    const tmrwA = tmrwTimes.map((_, i) => assess(wx, aqArr, tmrwSi + i));
    const tmrwWins = getWins(tmrwA);
    winsHtml = `
      <div class="win-row">
        <div class="win-day-label">Today</div>
        <div class="w-pills">${renderWinPills(todayWins, dayTimes)}</div>
      </div>
      <div class="win-row">
        <div class="win-day-label">Tomorrow</div>
        <div class="w-pills">${renderWinPills(tmrwWins, tmrwTimes)}</div>
      </div>`;
  }

  // Hourly table
  const rows = dayA.map((a, i) => {
    const isNow = isToday && i === curI;
    const why   = hourWhy(a);
    const whyCls = `${a.lvl}-why`;
    return `<tr${isNow ? ' class="now-row"' : ''}>
      <td><div class="td-time-cell">${fmtH(dayTimes[i])}${isNow ? `<span class="now-tag">Now</span>` : ''}
        ${why ? `<div class="td-why ${whyCls}">${why}</div>` : ''}</div></td>
      <td class="td-dot"><span class="dsm d-${a.lvl}"></span></td>
      <td class="${pavClass(a.pav)}">${a.pav}°</td>
      <td class="${flClass(a.feelsL)}">${a.feelsL}°</td>
      <td class="hide-sm neutral-t">${a.hum}%</td>
      <td class="td-rain">
        <div class="rbar-wrap">
          <div class="rbar-bg"><div class="rbar-fg" style="width:${a.rain}%"></div></div>
          <span class="rpct">${a.rain}%</span>
        </div>
      </td>
      <td class="td-wx">${wxi(a.wcode)}</td>
    </tr>`;
  }).join('');

  const hourlyHtml = `<div class="hourly-wrap"><table class="htable">
    <thead><tr>
      <th>Time</th><th></th><th>Pavement</th><th>Feels</th><th class="hide-sm">Humidity</th><th>Rain</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;

  // Compose page: chart BEFORE hourly
  document.getElementById('body').innerHTML =
    heroHtml + cardsHtml + dpHtml +
    `<div class="windows-box"><div class="section-hd">Best walk times</div>${winsHtml}</div>` +
    `<div class="section-hd">Charts</div><div id="chart-wrap"></div>` +
    `<div class="section-hd">Hour by hour</div>` + hourlyHtml +
    `<div class="legend">
      <div class="leg-i"><div class="leg-dot" style="background:var(--safe)"></div>Safe</div>
      <div class="leg-i"><div class="leg-dot" style="background:var(--caution)"></div>Caution</div>
      <div class="leg-i"><div class="leg-dot" style="background:var(--danger)"></div>Stay in</div>
      <div class="leg-note">Pavement temp: air temp + solar radiation estimate</div>
    </div>`;

  updateChart();

  if (isToday) setTimeout(() => {
    const r = document.querySelector('.now-row');
    if (r) r.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 80);
}

// ── Chart ─────────────────────────────────────────────────────

function getVisData() {
  const wx = S.wx;
  const aqArr = S.aq?.hourly?.us_aqi || null;
  const si = getDayStart(S.day);
  const dayTimes = wx.hourly.time.slice(si, si + 24);
  const dayA = dayTimes.map((_, i) => assess(wx, aqArr, si + i));
  const max = Math.max(0, dayA.length - 12);
  const start = Math.min(S.sliderStart, max);
  const vis = dayA.slice(start, start + 12);
  const visTimes = dayTimes.slice(start, start + 12);
  return { vis, visTimes, max, start };
}

function makeBars(vis, visTimes) {
  if (S.chartMode === 'rain') {
    return vis.map((a, i) => `<div class="chart-bar-col">
      <div class="cbar" style="height:${Math.max(1, a.rain)}%;background:#60A5FA;width:100%">
        <div class="cbar-tip">${fmtH(visTimes[i])}: ${a.rain}% rain</div>
      </div></div>`).join('');
  } else {
    const temps = vis.map(a => a.airT);
    const minT = Math.min(...temps) - 3, maxT = Math.max(...temps) + 3, range = maxT - minT || 1;
    return vis.map((a, i) => {
      const h = Math.max(2, Math.round(((a.airT - minT) / range) * 95));
      return `<div class="chart-bar-col">
        <div class="cbar" style="height:${h}%;background:${tempColor(a.airT)};width:100%">
          <div class="cbar-tip">${fmtH(visTimes[i])}: ${Math.round(a.airT)}°F</div>
        </div></div>`;
    }).join('');
  }
}

function updateChart() {
  const wrap = document.getElementById('chart-wrap');
  if (!wrap || !S.wx) return;
  const { vis, visTimes, max, start } = getVisData();
  const labels = visTimes.map(t => `<div class="clabel">${fmtH(t)}</div>`).join('');
  const startLabel = visTimes[0] ? fmtH(visTimes[0]) : '';
  const endLabel   = visTimes[visTimes.length - 1] ? fmtH(visTimes[visTimes.length - 1]) : '';
  const yLabel = S.chartMode === 'rain' ? 'Rain chance (%)' : 'Temperature (°F)';

  const sliderHtml = max > 0
    ? `<div class="slider-row">
        <input type="range" id="chart-slider" min="0" max="${max}" value="${start}" oninput="handleSlider(this.value)">
        <span class="rl" id="chart-rl">${startLabel} – ${endLabel}</span>
      </div>`
    : `<div class="slider-row" style="justify-content:flex-end"><span class="rl">${startLabel} – ${endLabel}</span></div>`;

  wrap.innerHTML = `<div class="chart-box">
    <div class="chart-tabs">
      <button class="ctab${S.chartMode === 'rain' ? ' active' : ''}" onclick="setChart('rain')">🌧 Rain</button>
      <button class="ctab${S.chartMode === 'temp' ? ' active' : ''}" onclick="setChart('temp')">🌡 Temp</button>
    </div>
    <div class="chart-y-label">${yLabel}</div>
    <div class="chart-area" id="chart-bars">${makeBars(vis, visTimes)}</div>
    <div class="chart-labels" id="chart-lbls">${labels}</div>
    ${sliderHtml}
  </div>`;
}

// ── Slider: only update bars, not the slider itself ───────────
function handleSlider(val) {
  S.sliderStart = +val;
  const { vis, visTimes } = getVisData();
  const bars = document.getElementById('chart-bars');
  const lbls = document.getElementById('chart-lbls');
  const rl   = document.getElementById('chart-rl');
  if (bars) bars.innerHTML = makeBars(vis, visTimes);
  if (lbls) lbls.innerHTML = visTimes.map(t => `<div class="clabel">${fmtH(t)}</div>`).join('');
  if (rl && visTimes.length) rl.textContent = `${fmtH(visTimes[0])} – ${fmtH(visTimes[visTimes.length - 1])}`;
}

function setChart(mode) { S.chartMode = mode; updateChart(); }
function selectDay(d) {
  S.day = d;
  S.sliderStart = d === 0 ? Math.max(0, new Date().getHours() - 1) : 0;
  render();
}

// ── Theme ─────────────────────────────────────────────────────

const THEME_BG = {dark:'#0A0C10',midnight:'#07090D',dusk:'#14101E',ocean:'#06111F',forest:'#0B1810',light:'#F0F4F8'};
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('tbtn');
  if (btn) btn.textContent = THEME_ICON[t] || '🎨';
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute('content', THEME_BG[t] || '#0A0C10');
}
function cycleTheme() {
  S.theme = THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length];
  localStorage.setItem('ww-theme', S.theme);
  applyTheme(S.theme);
}

// ── Misc ──────────────────────────────────────────────────────

function spin(msg) {
  document.getElementById('body').innerHTML = `<div class="cscreen"><div class="spinner"></div><div style="color:var(--muted);font-size:14px;margin-top:6px">${msg}</div></div>`;
}
function showErr(msg) {
  document.getElementById('body').innerHTML = `<div class="cscreen">
    <div class="big-icon">😕</div>
    <div class="c-title" style="font-size:18px">Could not get location</div>
    <div class="c-sub">${msg}</div>
    <div class="c-sub" style="margin-top:4px;font-size:13px">You can also enter a ZIP code or city in the search bar above.</div>
    <button class="btn-go" onclick="startApp()">📍 Try again</button>
  </div>`;
}

// ── Init: restore cached location or request GPS ─────────────
async function init() {
  const lat  = parseFloat(localStorage.getItem('ww-lat') || '');
  const lon  = parseFloat(localStorage.getItem('ww-lon') || '');
  const city = localStorage.getItem('ww-city') || '';

  if (lat && lon) {
    // Restore cached location — no GPS prompt needed
    S.lat = lat; S.lon = lon; S.city = city; S.fetched = new Date();
    try {
      const [wx, aq] = await Promise.all([fetchWx(), fetchAQ()]);
      S.wx = wx; S.aq = aq;
      S.sliderStart = Math.max(0, new Date().getHours() - 1);
      render();
      document.getElementById('rbtn').disabled = false;
    } catch { startApp(); return; }

    // Silently refresh GPS in background; only reload if moved >~1 km
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        if (Math.abs(pos.coords.latitude - S.lat) > 0.01 ||
            Math.abs(pos.coords.longitude - S.lon) > 0.01) {
          onPos(pos); // moved — reload with new location
        }
      }, () => {}, { timeout: 8000, maximumAge: 300000 });
    }
  } else {
    // First visit — request GPS immediately (browser shows its native dialog)
    startApp();
  }
}

init();
</script>
